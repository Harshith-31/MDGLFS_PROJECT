version: '3.8'

services:
  forensics-engine:
    build: .
    container_name: md-dgfls-engine
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./datasets:/app/datasets
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
